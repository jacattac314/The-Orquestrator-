[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "openclaw"
version = "0.1.0"
description = "OpenClaw — an AI agent built on NVIDIA AgentIQ / NeMo Agent Toolkit"
requires-python = ">=3.11"
dependencies = [
    "aiqtoolkit[langchain]~=1.1",
    "pydantic>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "duckduckgo-search>=6.0",
    "wikipedia-api>=0.6",
    "rich>=13.0",
    "gradio>=4.40",
]

[project.optional-dependencies]
memory = ["mem0ai>=0.1"]
gmail = [
    "google-api-python-client>=2.100",
    "google-auth-oauthlib>=1.0",
    "google-auth-httplib2>=0.2",
]
mcp = ["mcp>=1.0"]
telemetry = [
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-grpc>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
    "opentelemetry-instrumentation-langchain>=0.1",
]
phoenix = ["openclaw[telemetry]", "arize-phoenix-otel>=0.6"]
langfuse = ["openclaw[telemetry]", "langfuse>=3.0"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
]
all = [
    "openclaw[memory]",
    "openclaw[gmail]",
    "openclaw[mcp]",
    "openclaw[telemetry]",
    "openclaw[dev]",
]

[project.scripts]
openclaw-ui = "openclaw.app:main"
openclaw-mcp = "openclaw.mcp_server:main"

[project.entry-points.'aiq.components']
openclaw = "openclaw.register"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
