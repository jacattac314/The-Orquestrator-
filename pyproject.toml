[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "openclaw"
version = "0.1.0"
description = "OpenClaw — an AI agent built on NVIDIA AgentIQ / NeMo Agent Toolkit"
requires-python = ">=3.11"
dependencies = [
    "aiqtoolkit[langchain]~=1.1",
    "pydantic>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "duckduckgo-search>=6.0",
    "wikipedia-api>=0.6",
    "rich>=13.0",
    "gradio>=4.40",
]

[project.scripts]
openclaw-ui = "openclaw.app:main"

[project.entry-points.'aiq.components']
openclaw = "openclaw.register"

[tool.setuptools.packages.find]
where = ["src"]
