# OpenClaw — NVIDIA AgentIQ Workflow Configuration
# ─────────────────────────────────────────────────────────────────────────────
# Run with:
#   aiq run --config_file src/openclaw/configs/config.yml \
#            --input "Your question here"
#
# Required environment variable:
#   NVIDIA_API_KEY — get yours at https://build.nvidia.com
# ─────────────────────────────────────────────────────────────────────────────

functions:
  web_search:
    _type: openclaw_web_search
    max_results: 5
    region: wt-wt

  wiki_search:
    _type: openclaw_wiki_search
    language: en
    sentences: 5

  datetime:
    _type: openclaw_datetime
    timezone_name: UTC

  system_info:
    _type: openclaw_system_info

  url_fetch:
    _type: openclaw_url_fetch
    timeout_seconds: 15.0
    max_chars: 4000

  calculator:
    _type: openclaw_calculator

  # Persistent cross-session memory backed by mem0ai.
  # Requires: pip install mem0ai
  # Local mode uses NVIDIA_API_KEY for its internal LLM/embedder.
  # Cloud mode requires MEM0_API_KEY (set provider: cloud).
  memory_store:
    _type: openclaw_memory
    user_id: default
    provider: local

  memory_recall:
    _type: openclaw_memory
    user_id: default
    provider: local

  # Code runner is disabled by default for safety.
  # Set allowed: true only in trusted environments.
  code_runner:
    _type: openclaw_code_runner
    timeout_seconds: 10
    allowed: false

  # ── Gmail + Google Calendar tools ───────────────────────────────────────────
  # Requires one-time OAuth2 setup — run: python scripts/google_setup.py
  # Place credentials JSON at ~/.openclaw/google_credentials.json
  # (or set GOOGLE_CREDENTIALS_FILE env var to a custom path).
  #
  gmail_summary:
    _type: openclaw_gmail_summary
    max_unread: 20           # messages scanned for the inbox briefing

  gmail_list:
    _type: openclaw_gmail_list
    max_results: 10
    unread_only: true

  gmail_read:
    _type: openclaw_gmail_read

  gmail_search:
    _type: openclaw_gmail_search
    max_results: 10

  gmail_followup:
    _type: openclaw_gmail_followup
    days_threshold: 3        # flag sent emails with no reply after 3 days

  gmail_mark:
    _type: openclaw_gmail_mark

  # ── Google Calendar ──────────────────────────────────────────────────────────
  calendar_list:
    _type: openclaw_calendar_list
    days: 7              # look 7 days ahead by default
    max_results: 20

  calendar_search:
    _type: openclaw_calendar_search
    days_back: 30
    days_forward: 60

  calendar_create:
    _type: openclaw_calendar_create

  calendar_update:
    _type: openclaw_calendar_update

  calendar_delete:
    _type: openclaw_calendar_delete

  calendar_free_slots:
    _type: openclaw_calendar_free_slots
    duration_minutes: 60  # find gaps of at least 60 minutes

llms:
  nim_llm:
    _type: nim
    # Model served via NVIDIA NIM — swap for any NIM-compatible endpoint.
    # See available models at: https://build.nvidia.com/explore/discover
    model_name: meta/llama-3.3-70b-instruct
    temperature: 0.0
    max_tokens: 2048

workflow:
  _type: tool_calling_agent
  tool_names:
    - web_search
    - wiki_search
    - datetime
    - system_info
    - url_fetch
    - calculator
    - memory_store
    - memory_recall
    - code_runner
    - gmail_summary
    - gmail_list
    - gmail_read
    - gmail_search
    - gmail_followup
    - gmail_mark
    - calendar_list
    - calendar_search
    - calendar_create
    - calendar_update
    - calendar_delete
    - calendar_free_slots
  llm_name: nim_llm
  verbose: true
  handle_tool_errors: true

general:
  use_uvloop: true
