# OpenClaw — Local / OpenAI-compatible LLM variant
# ─────────────────────────────────────────────────────────────────────────────
# Use this config if you're running a local model server (vLLM, Ollama, LM
# Studio, llama.cpp, etc.) that exposes an OpenAI-compatible /v1 endpoint.
#
# Run with:
#   aiq run --config_file src/openclaw/configs/config_local.yml \
#            --input "Your question here"
# ─────────────────────────────────────────────────────────────────────────────

functions:
  web_search:
    _type: openclaw_web_search
    max_results: 5

  wiki_search:
    _type: openclaw_wiki_search
    language: en
    sentences: 5

  datetime:
    _type: openclaw_datetime

  system_info:
    _type: openclaw_system_info

  url_fetch:
    _type: openclaw_url_fetch

  calculator:
    _type: openclaw_calculator

  code_runner:
    _type: openclaw_code_runner
    timeout_seconds: 10
    allowed: false

  # ── Gmail + Google Calendar tools ───────────────────────────────────────────
  # Requires one-time OAuth2 setup — run: python scripts/google_setup.py
  #
  gmail_summary:
    _type: openclaw_gmail_summary
    max_unread: 20

  gmail_list:
    _type: openclaw_gmail_list
    max_results: 10
    unread_only: true

  gmail_read:
    _type: openclaw_gmail_read

  gmail_search:
    _type: openclaw_gmail_search
    max_results: 10

  gmail_followup:
    _type: openclaw_gmail_followup
    days_threshold: 3

  gmail_mark:
    _type: openclaw_gmail_mark

  calendar_list:
    _type: openclaw_calendar_list
    days: 7
    max_results: 20

  calendar_search:
    _type: openclaw_calendar_search
    days_back: 30
    days_forward: 60

  calendar_create:
    _type: openclaw_calendar_create

  calendar_update:
    _type: openclaw_calendar_update

  calendar_delete:
    _type: openclaw_calendar_delete

  calendar_free_slots:
    _type: openclaw_calendar_free_slots
    duration_minutes: 60

llms:
  local_llm:
    _type: openai
    # Point to your local server — examples:
    #   Ollama:       http://localhost:11434/v1
    #   vLLM:         http://localhost:8000/v1
    #   llama.cpp:    http://localhost:8080/v1
    base_url: "http://localhost:11434/v1"
    model_name: "llama3.2"   # must match the model name your server expects
    temperature: 0.0
    max_tokens: 2048
    api_key: "none"           # required field but ignored by most local servers

workflow:
  _type: tool_calling_agent
  tool_names:
    - web_search
    - wiki_search
    - datetime
    - system_info
    - url_fetch
    - calculator
    - gmail_summary
    - gmail_list
    - gmail_read
    - gmail_search
    - gmail_followup
    - gmail_mark
    - calendar_list
    - calendar_search
    - calendar_create
    - calendar_update
    - calendar_delete
    - calendar_free_slots
  llm_name: local_llm
  verbose: true
  handle_tool_errors: true
